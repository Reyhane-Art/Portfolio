<title>پنل مدیریت | ریحانه پیرزاده مقدم</title>
<style>
@font-face{font-family:Doran;font-weight:400;src:url(../fonts/doran-regular.woff) format('woff');font-display:swap}
@font-face{font-family:Doran;font-weight:700;src:url(../fonts/doran-bold.woff) format('woff');font-display:swap}
@font-face{font-family:Doran;font-weight:900;src:url(../fonts/doran-xblack.woff) format('woff');font-display:swap}
:root{--bg:#EEEEEB;--card:#F8F8F6;--ink:#0C0C0C;--mute:#6A6963;--line:#D8D7D1;--bronze:#94602E;--ok:#2F7D4F;--err:#B3372B;--acc:#0C0C0C;--onacc:#EEEEEB;--sh:0 12px 40px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--card:#1D1B18;--ink:#EEEEEB;--mute:#A09E96;--line:#34322D;--bronze:#C58A4A;--ok:#58B27C;--err:#E0705F;--acc:#EEEEEB;--onacc:#141311;--sh:0 12px 40px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 Doran,Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.8rem;padding:.7rem max(16px,env(safe-area-inset-right)) .7rem max(16px,env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:1.05rem;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{font-weight:400;color:var(--mute);margin-inline-start:.6rem}
.dot{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--ok);margin-inline-end:.4rem}
.dot.d{background:var(--bronze)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.4rem;padding:.35rem 1.1rem;border:1px solid var(--ink);border-radius:2rem;background:transparent;font-weight:700;white-space:nowrap;transition:background .2s,color .2s,opacity .2s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.pri{background:var(--acc);color:var(--onacc)}.btn.pri:hover{opacity:.85}
.btn.sm{min-height:2rem;padding:.15rem .8rem;font-size:.9rem}
.btn.danger{border-color:var(--err);color:var(--err)}.btn.danger:hover{background:var(--err);color:#fff}
.btn:disabled{opacity:.45;pointer-events:none}
.shell{display:grid;grid-template-columns:13.5rem minmax(0,1fr);gap:0;max-width:78rem;margin:0 auto}
.side{position:sticky;top:3.6rem;align-self:start;display:flex;flex-direction:column;gap:.2rem;padding:1.2rem max(16px,env(safe-area-inset-right)) 1.2rem .6rem}
.side button{display:flex;align-items:center;gap:.6rem;text-align:start;border:0;background:transparent;padding:.55rem .9rem;border-radius:.7rem;font-weight:700;color:var(--mute)}
.side button:hover{color:var(--ink)}
.side button[aria-current="true"]{background:var(--ink);color:var(--bg)}
.side b{margin-inline-start:auto;font-size:.78rem;opacity:.75}
main{min-width:0;padding:1.4rem max(16px,env(safe-area-inset-left)) 6rem 1rem}
h2{margin:0 0 .3rem;font-size:1.5rem;font-weight:900}
.lead{margin:0 0 1.4rem;color:var(--mute);max-width:60ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1.1rem 1.2rem;margin-bottom:1rem}
details.card>summary{cursor:pointer;font-weight:900;font-size:1.05rem;list-style:none;display:flex;align-items:center;gap:.6rem}
details.card>summary::before{content:"";width:.55rem;height:.55rem;border-inline-end:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .25s;margin-top:-.2rem}
details.card[open]>summary::before{transform:rotate(-135deg);margin-top:.2rem}
details.card>summary::-webkit-details-marker{display:none}
details.card[open]>summary{margin-bottom:1rem}
.fld{margin-bottom:1.1rem}
.fld>label,.lbl{display:block;font-weight:700;font-size:.92rem;margin-bottom:.3rem}
.fld .hint,.hint{color:var(--mute);font-size:.84rem;margin:.2rem 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem}
@media(max-width:720px){.two,.three{grid-template-columns:1fr}}
.in{width:100%;padding:.55rem .8rem;border:1px solid var(--line);border-radius:.7rem;background:var(--bg);min-height:2.5rem;transition:border-color .2s,box-shadow .2s}
.in:focus{outline:0;border-color:var(--bronze);box-shadow:0 0 0 3px color-mix(in srgb,var(--bronze) 25%,transparent)}
textarea.in{resize:vertical;min-height:4.5rem;line-height:1.75}
.en{direction:ltr;text-align:left;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:.95rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--mute);margin-bottom:.15rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(12.5rem,1fr));gap:1rem}
.wc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:1rem;overflow:hidden;display:flex;flex-direction:column}
.wc img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--line);cursor:pointer}
.wc .meta{padding:.6rem .8rem .2rem;min-width:0}
.wc .t{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc .s{font-size:.82rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc .act{display:flex;gap:.3rem;padding:.5rem .6rem .7rem;margin-top:auto}
.ic{width:2.1rem;height:2.1rem;border:1px solid var(--line);border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:1rem;line-height:1;padding:0}
.ic:hover{border-color:var(--ink)}
.ic:disabled{opacity:.3;pointer-events:none}
.badge{position:absolute;top:.5rem;inset-inline-start:.5rem;background:var(--ink);color:var(--bg);border-radius:2rem;padding:.05rem .65rem;font-size:.74rem;font-weight:700}
.badge.new{inset-inline-start:auto;inset-inline-end:.5rem;background:var(--bronze);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-bottom:1.2rem}
.bar .grow{flex:1}
.row{display:flex;gap:.6rem;align-items:flex-start}
.row>.in:first-child{flex:none}
.cvr{display:grid;grid-template-columns:5.5rem 1fr 1fr auto;gap:.5rem;align-items:start;padding:.6rem 0;border-top:1px dashed var(--line)}
.cvr.sub{background:color-mix(in srgb,var(--bronze) 10%,transparent);border-radius:.6rem;padding-inline:.5rem}
.cvr .acts{display:flex;gap:.25rem}
@media(max-width:720px){.cvr{grid-template-columns:1fr 1fr}.cvr .y{grid-column:1/-1}.cvr .acts{grid-column:1/-1}}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(1rem,4vh) 1rem;overflow:auto}
.sheet{width:min(46rem,100%);background:var(--bg);border-radius:1.2rem;box-shadow:var(--sh);padding:1.3rem 1.4rem 1.2rem}
.sheet h3{margin:0 0 1rem;font-size:1.25rem;font-weight:900}
.sheet .foot{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.2rem;padding-top:1rem;border-top:1px solid var(--line)}
.sheet .foot .grow{flex:1}
.crop{display:flex;gap:1.2rem;flex-wrap:wrap;align-items:flex-start;margin-bottom:1.2rem}
.crop .cw{flex:none;width:min(100%,20rem)}
.crop canvas{width:100%;aspect-ratio:1;border-radius:.8rem;background:var(--line);touch-action:none;cursor:grab}
.crop canvas.big{aspect-ratio:auto}
.crop .ctl{flex:1;min-width:12rem}
.crop img.cur{width:100%;aspect-ratio:1;object-fit:cover;border-radius:.8rem}
input[type=range]{width:100%;accent-color:var(--bronze)}
.pv{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.pv .pb{display:flex;gap:.6rem;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
.pv .pb .grow{flex:1}
.pv .fw{flex:1;min-height:0;display:flex;justify-content:center;background:color-mix(in srgb,var(--ink) 8%,var(--bg))}
.pv iframe{border:0;width:100%;height:100%;background:#fff;transition:width .3s}
.pv.m iframe{width:390px;max-width:100%;box-shadow:var(--sh)}
.toast{position:fixed;inset-inline:0;bottom:1.2rem;z-index:90;display:flex;justify-content:center;pointer-events:none}
.toast span{background:var(--ink);color:var(--bg);padding:.6rem 1.3rem;border-radius:2rem;font-weight:700;box-shadow:var(--sh);animation:up .3s}
.toast span.err{background:var(--err);color:#fff}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.log{margin:1rem 0 0;padding:.9rem 1rem;border-radius:.8rem;background:var(--card);border:1px solid var(--line);font-size:.9rem;max-height:16rem;overflow:auto;white-space:pre-wrap;direction:rtl}
.log .e{color:var(--err);font-weight:700}.log .o{color:var(--ok);font-weight:700}
ul.chg{margin:.3rem 0 0;padding-inline-start:1.2rem}
.note{padding:.8rem 1rem;border-radius:.8rem;background:color-mix(in srgb,var(--bronze) 12%,transparent);border:1px solid color-mix(in srgb,var(--bronze) 40%,transparent);font-size:.92rem;margin-bottom:1rem}
.steps{margin:.2rem 0 0;padding-inline-start:1.3rem}.steps li{margin-bottom:.4rem}
code,.code{direction:ltr;unicode-bidi:embed;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em;background:var(--line);padding:.05rem .4rem;border-radius:.35rem}
@media(max-width:560px){.top #status{font-size:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}.wc .act{flex-wrap:wrap}.wc .act .btn{flex:1 0 100%}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:3.6rem;z-index:20;flex-direction:row;overflow-x:auto;gap:.3rem;padding:.6rem max(16px,env(safe-area-inset-right)) .6rem max(16px,env(safe-area-inset-left));background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .side button{white-space:nowrap;flex:none}
  main{padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}
  .top h1 small{display:none}
}

.in.auto{background:color-mix(in srgb,var(--bronze) 11%,var(--bg));border-color:var(--bronze);border-style:dashed}
.in[readonly]{opacity:.6}
.trn{display:flex;flex-wrap:wrap;gap:.2rem .9rem;align-items:center;margin-top:.4rem;font-size:.84rem;color:var(--bronze)}
.cvr .trn{grid-column:1/-1;margin-top:0}
.lnk{background:none;border:0;padding:0;color:var(--ink);font-weight:700;text-decoration:underline;font-size:inherit}
</style>
</head>

against a cube, caught between reason and feeling.","fa":"چهار پیکر برنزی در برخورد با یک مکعب، میان عقل و احساس."},"pr.n":{"en":"{n} works","fa":"{n} اثر"},"cube.lbl":{"en":"Series","fa":"مجموعه"},"cube.h":{"en":"The Inner Cube","fa":"مکعب درون"},"cube.p1":{"en":"This series reflects an inner struggle that every person meets, sooner or later, along the course of life: a tension between reason, which draws borders and angles, and feeling, which rebels against every limit.","fa":"این مجموعه بازتاب جدالی درونی است که هر انسان، دیر یا زود، در مسیر زیست خود با آن مواجه می‌شود؛ کشاکشی میان عقل که مرز و زاویه می‌سازد، و احساس که سر باز می‌زند از هر محدودیتی."},"cube.p2":{"en":"The figures in these works are half human, somewhere between life and death, between muscle and bone. They face a cube that is both alien and familiar; it carries the weight of reason and the tremor of doubt. A volume that seems fixed and rigid, yet changes on contact with the body and loses its own boundaries.","fa":"فیگورها در این آثار نیمه انسانی‌اند؛ در جایی میان زندگی و مرگ، میان ماهیچه و استخوان. آن‌ها با مکعبی مواجه‌اند که هم بیگانه است و هم آشنا؛ هم سنگینی خرد را در خود دارد و هم لرزش تردید. حجمی که به‌ظاهر ثابت و صُلب است اما در تماس با بدن دگرگون می‌شود و مرزهای خویش را از دست می‌دهد."},"cube.p3":{"en":"In this encounter, bodies collapse and are built again: moments of tension and resistance, of surrender and fatigue. Each figure bears witness to how hard it is to balance reason and feeling, a balance with no final destination, formed only through trial and error and lived experience.","fa":"در این برخورد، تن‌ها فرو می‌ریزند و دوباره ساخته می‌شوند؛ لحظه‌هایی از کشش و مقاومت، از تسلیم و خستگی. هر فیگور گواهی است بر دشواری برقراری توازن میان عقل و احساس؛ توازنی که مقصدی قطعی ندارد و تنها در مسیر آزمون و خطا و تجربه‌ی زیسته شکل می‌گیرد."},"cube.p4":{"en":"These sculptures tell of an endless search: the search of a human being who, between the rigidity of reason and the fluidity of feeling, is always changing.","fa":"این مجسمه‌ها روایتگر جست‌وجویی بی‌پایان‌اند؛ جست‌وجوی انسانی که میان صُلبیت عقل و سیالی احساس، مدام در حال دگرگونی است."},"cube.sig":{"en":"Bronze on a stone base · Four works","fa":"برنز روی پایه سنگ · چهار اثر"},"cube.hint":{"en":"Scroll or swipe through the series","fa":"برای دیدن مجموعه اسکرول یا سوایپ کنید"},"about.lbl":{"en":"About","fa":"درباره من"},"about.s":{"en":"I'm Reyhaneh Pirzadeh Moghadam, an artist and sculptor. I hold a bachelor's degree in sculpture and a master's in painting, and alongside my practice I work as an art teacher.","fa":"من، ریحانه پیرزاده مقدم، هنرمند و مجسمه‌ساز، فارغ‌التحصیل کارشناسی مجسمه‌سازی و کارشناسی ارشد نقاشی هستم و در کنار فعالیت‌های هنری، به عنوان مدرس هنر نیز مشغول به کارم."},"about.p2":{"en":"My path in art began with graphic design, grew richer through painting, and found its focus in sculpture, where I could translate my view of space, material and form into a three-dimensional language.","fa":"مسیر من در هنر از گرافیک آغاز شد، با نقاشی غنی‌تر شد و در مجسمه‌سازی به نقطه تمرکز رسید؛ جایی که توانستم نگاه خود به فضا، ماده و فرم را به زبان سه‌بعدی ترجمه کنم."},"about.p3":{"en":"Working with a wide range of materials, from iron and stone to bronze and fiberglass, has let me find a new way to express my ideas each time. For me a sculpture is never only an independent volume: sometimes it is the voice of a space, sometimes the reflection of a memory, and sometimes a wordless conversation with the viewer.","fa":"تجربه کار با متریال‌های متنوع، از آهن و سنگ تا برنز و فایبرگلاس، به من این امکان را داده که هر بار شیوه‌ای تازه برای بیان ایده‌هایم بیابم. برای من، مجسمه فقط یک حجم مستقل نیست؛ گاهی صدای فضاست، گاهی بازتابی از خاطره، و گاهی گفت‌وگویی بی‌کلام با مخاطب."},"about.p4":{"en":"In my work I try to build a bridge between aesthetics and lived experience: to make pieces that, besides their visual value, offer a chance for connection, discovery and a shared experience between the work and its viewer.","fa":"در آثارم تلاش می‌کنم میان زیبایی‌شناسی و تجربه زیسته پلی بزنم؛ آثاری بیافرینم که علاوه بر ارزش بصری، فرصتی برای ارتباط، مکاشفه و تجربه مشترک میان اثر و بیننده فراهم کنند."},"about.pull":{"en":"Sometimes the voice of a space, sometimes the reflection of a memory, and sometimes a wordless conversation with the viewer.","fa":"گاهی صدای فضا، گاهی بازتاب خاطره، و گاهی گفت‌وگویی بی‌کلام با مخاطب."},"about.fig":{"en":"Reyhaneh Pirzadeh Moghadam","fa":"ریحانه پیرزاده مقدم"},"cv.lbl":{"en":"Background","fa":"سوابق"},"cv.h":{"en":"Resume","fa":"رزومه"},"ct.lbl":{"en":"Contact","fa":"تماس"},"ct.h":{"en":"Let's talk","fa":"بیایید گفت‌وگو کنیم"},"ct.lead":{"en":"For commissions, collaborations or invitations to events, write to me through any of these.","fa":"برای سفارش اثر، همکاری یا دعوت به رویداد، از یکی از این راه‌ها پیام بدهید."},"ct.cta":{"en":"Message on Telegram","fa":"پیام در تلگرام"},"ct.tg":{"en":"Telegram","fa":"تلگرام"},"ct.ig":{"en":"Instagram","fa":"اینستاگرام"},"ct.em":{"en":"Email","fa":"ایمیل"},"ct.ph":{"en":"Phone","fa":"تلفن"},"ct.copied":{"en":"Copied","fa":"کپی شد"},"ct.sel":{"en":"Text selected, copy it","fa":"متن انتخاب شد، کپی کنید"},"ft.c":{"en":"© 2026 Reyhaneh Pirzadeh Moghadam. All rights to the works reserved.","fa":"© ۱۴۰۵ ریحانه پیرزاده مقدم. همه حقوق آثار محفوظ است."},"ft.top":{"en":"Back to top ↑","fa":"بازگشت به بالا ↑"},"lb.year":{"en":"Year","fa":"سال"},"lb.mat":{"en":"Material","fa":"متریال"},"lb.dim":{"en":"Dimensions","fa":"ابعاد"},"lb.place":{"en":"Place","fa":"مکان"},"lb.cm":{"en":"cm","fa":"سانتی‌متر"},"a.close":{"en":"Close","fa":"بستن"},"a.prev":{"en":"Previous work","fa":"اثر قبلی"},"a.next":{"en":"Next work","fa":"اثر بعدی"},"a.lb":{"en":"Enlarged view of the work","fa":"نمایش بزرگ اثر"},"a.menu":{"en":"Menu","fa":"منو"},"a.nav":{"en":"Main navigation","fa":"ناوبری اصلی"},"a.theme":{"en":"Switch between light and dark theme","fa":"تغییر تم روشن و تاریک"},"a.lang":{"en":"Language","fa":"زبان"},"a.filters":{"en":"Filter works","fa" }

const dimsOf=b=>[b.width||b.naturalWidth,b.height||b.naturalHeight];
function cv(w,hh){const c=document.createElement('canvas');c.width=w;c.height=hh;return c}
function resize(src,sx,sy,sw,sh,dw,dh){ // stepwise halving for clean downscale
  let cur=src,cx=sx,cy=sy,cw=sw,ch=sh;
  while(cw/2>=dw*1.0001&&ch/2>=dh){
    const n=cv(Math.max(1,Math.round(cw/2)),Math.max(1,Math.round(ch/2)));const g=n.getContext('2d');g.imageSmoothingQuality='high';
    g.drawImage(cur,cx,cy,cw,ch,0,0,n.width,n.height);cur=n;cx=cy=0;cw=n.width;ch=n.height;
  }
  const o=cv(dw,dh),g=o.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cur,cx,cy,cw,ch,0,0,dw,dh);return o;
}
async function enc(canvas,q){

  if(b&&b.type==='image/webp')return {blob:b,ext:'webp'};
  b=await new Promise(r=>canvas.toBlob(r,'image/jpeg',Math.min(.92,q+.1)));return {blob:b,ext:'jpg'};
}
async function tiny(src,sx,sy,sw,sh,w,hh){ // lqip + average colour

  const a=resize(src,sx,sy,sw,sh,8,8).getContext('2d').getImageData(0,0,8,8).data;let r=0,g=0,b=0;
  for(let i=0;i<a.length;i+=4){r+=a[i];g+=a[i+1];b+=a[i+2]}const n=a.length/4;

}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

async function makeZip(files){ // files:[{name,blob|text}]

  const d=new Date(),dt=((d.getFullYear()-1980)<<9|(d.getMonth()+1)<<5|d.getDate()),tm=(d.getHours()<<11|d.getMinutes()<<5|d.getSeconds()>>1);
  for(const f of files){
    const data=f.blob?new Uint8Array(await f.blob.arrayBuffer()):enc.encode(f.text),name=enc.encode(f.name),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
    cen.push(ch.buffer,name);off+=30+name.length+data.length;
  }
  const csz=cen.reduce((a,b)=>a+(b.byteLength!==undefined?b.byteLength:b.length),0);
  const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,csz,true);end.setUint32(16,off,true);
  return new Blob([...parts,...cen,end.buffer],{type:'application/zip'});
}

/* every request has a time limit, so a stalled connection can never leave the panel waiting forever */

async function geminiModel(base){ // newest stable "flash" model that supports generateContent

  try{

    const t=(((j.choices||[])[0]||{}).message||{}).content||'';if(!t)throw new TrErr('format','empty');return {text:t,model};

/* ---- examples from the artist's own, already-reviewed content ---- */
function exampleBank(skip){
  const c=st.c,b={'artwork title':[],'artwork material':[],'location':[],'category name':[],'category description':[],'CV entry':[],'copy':[]};
  const add=(k,o)=>{if(o&&!skip.has(o)&&o.en&&o.fa&&!o._t&&o.en.length<420&&o.fa.length<420)b[k].push({persian:o.fa,english:o.en})};
  c.works.forEach(w=>{add('artwork title',w.title);add('artwork material',w.mat);add('location',w.place)});
  c.cats.forEach(k=>{add('category name',k.name);add('category description',k.desc)});
  c.resume.forEach(col=>col.items.forEach(it=>{if(!it.sub)add('CV entry',it)}));
  Object.keys(c.tx).forEach(k=>add('copy',c.tx[k]));
  return b;
}
function refsFor(kinds,skip){
  const bank=exampleBank(skip),out={};
  kinds.forEach(k=>{
    let pool=bank[k];
    if(!pool){const long=/paragraph/.test(k);pool=bank.copy.filter(p=>long?p.english.length>60:p.english.length<=60)}
    const seen=new Set(),pick=[];for(const p of pool){if(!seen.has(p.english)){seen.add(p.english);pick.push(p);if(pick.length>=(/paragraph/.test(k)?3:8))break}}

}
function trClean(t,to,src){

async function trRequest(items,from,to,objs){

/* ---- queue: batches quick successive requests, retries on rate limits ---- */
const TRQ={items:[],timer:0,running:false,last:0},TRBUSY=new Set();

  const p=new Promise((res,rej)=>{TRQ.items.push({it,res,rej});clearTimeout(TRQ.timer);TRQ.timer=setTimeout(trFlush,350)});

}
const trIdle=()=>Promise.allSettled([...TRBUSY]);
async function trFlush(){
  if(TRQ.running){TRQ.timer=setTimeout(trFlush,400);return}
  const batch=TRQ.items.splice(0);if(!batch.length)return;TRQ.running=true;
  try{
    const groups={};batch.forEach(b=>{const k=b.it.from+b.it.to;(groups[k]=groups[k]||[]).push(b)});
    for(const k in groups){await trRun(groups[k]);await sleep(Math.max(0,800-(Date.now()-TRQ.last)))}

}
async function trRun(g){
  const from=g[0].it.from,to=g[0].it.to,delays=[4000,10000,20000];let n=0;
  for(;;){
    try{
      TRQ.last=Date.now();
      const out=await trRequest(g.map((b,i)=>({id:String(i+1),kind:b.it.kind,text:b.it.text})),from,to,g.map(b=>b.it.obj));
      g.forEach((b,i)=>{const t=out[String(i+1)];t?b.res(t):b.rej(new TrErr('format','missing'))});return;
    }catch(e){

    }

function trBind(obj,els,note,kind){

    if(m)note.append(h('span',{},'ترجمهٔ خودکار '+(m==='fa'?'فارسی':'انگلیسی')+' — لطفاً بخوانید و در صورت نیاز اصلاح کنید.'),
      h('button',{class:'lnk',type:'button',onclick:()=>{delete obj._t;refresh();touch()}},'✓ درست است'),
      h('button',{class:'lnk',type:'button',onclick:()=>run(m==='fa'?'en':'fa',true)},'↻ ترجمهٔ دوباره'));
  };

  try{
    const {owner,repo,branch}=st.cfg,B=`/repos/${owner}/${repo}`;
    logLine('اتصال به گیت‌هاب…');
    const ref=await gh(`${B}/git/ref/heads/${encodeURIComponent(branch)}`),head=ref.object.sha,commit=await gh(`${B}/git/commits/${head}`);
    let remote=null;
    try{const f=await gh(`${B}/contents/content.json?ref=${encodeURIComponent(branch)}`);remote={sha:f.sha,json:JSON.parse(unb64utf8(f.content))}}catch(e){if(e.status!==404)throw e}
    if(remote&&st.baseSha&&remote.sha!==st.baseSha){
      const k=await ask('سایت در این فاصله تغییر کرده','نسخهٔ منتشرشدهٔ سایت با نسخه‌ای که ویرایش می‌کردید فرق دارد (شاید از دستگاه دیگری منتشر شده). اگر ادامه دهید، همین نسخهٔ شما جایگزین می‌شود.',[{key:0,label:'انصراف'},{key:1,label:'ادامه و جایگزین کردن',cls:'danger'}]);
      if(!k){logLine('انتشار لغو شد.','e');st.busy=false;rerender();return}
    }
    const used=usedFiles(st.c),old=remote?usedFiles(remote.json):new Set(),entries=[];
    const jobs=[];
    for(const base in st.pend){const p=st.pend[base];for(const s in p.files){const path=`img/${base}-${s}.${p.ext}`;if(used.has(path))jobs.push({path,blob:p.files[s]})}}
    let n=0;logLine('بارگذاری '+faNum(jobs.length)+' فایل عکس…');
    for(const j of jobs){const bl=await gh(`${B}/git/blobs`,{method:'POST',body:{content:await blobB64(j.blob),encoding:'base64'}});entries.push({path:j.path,mode:'100644',type:'blob',sha:bl.sha});logLine('  '+faNum(++n)+' / '+faNum(jobs.length));}
    const text=JSON.stringify(st.c,null,1)+'\n';
    const cb=await gh(`${B}/git/blobs`,{method:'POST',body:{content:b64utf8(text),encoding:'base64'}});
    entries.push({path:'content.json',mode:'100644',type:'blob',sha:cb.sha});
    let del=0;old.forEach(p=>{if(!used.has(p)){entries.push({path:p,mode:'100644',type:'blob',sha:null});del++}});
    if(del)logLine('حذف '+faNum(del)+' عکس قدیمی که دیگر استفاده نمی‌شود…');
    logLine('ثبت تغییرات…');
    const tree=await gh(`${B}/git/trees`,{method:'POST',body:{base_tree:commit.tree.sha,tree:entries}});
    const nc=await gh(`${B}/git/commits`,{method:'POST',body:{message:'به‌روزرسانی محتوا از پنل مدیریت',tree:tree.sha,parents:[head]}});
    await gh(`${B}/git/refs/heads/${encodeURIComponent(branch)}`,{method:'PATCH',body:{sha:nc.sha}});
    st.base=ser();st.baseSha=cb.sha;for(const b in st.pend)st.prev[b]=st.pend[b];st.pend={};await DB.del();
    logLine('منتشر شد ✓ — حدود یک تا دو دقیقه بعد روی سایت دیده می‌شود.','o');toast('منتشر شد ✓');
  }catch(e){console.error(e);logLine(ghMsg(e),'e')}
  st.busy=false;rerender();showLog();
}
async function downloadZip(){
  const pr=problems();if(pr.length){toast(pr[0],true);return}
  const used=usedFiles(st.c),files=[{name:'content.json',text:JSON.stringify(st.c,null,1)+'\n'}];
  for(const base in st.pend){const p=st.pend[base];for(const s in p.files){const path=`img/${base}-${s}.${p.ext}`;if(used.has(path))files.push({name:path,blob:p.files[s]})}}
  const z=await makeZip(files),a=h('a',{href:URL.createObjectURL(z),download:'site-update.zip'});document.body.append(a);a.click();a.remove();
  toast('فایل zip دانلود شد. محتوای آن را روی مخزن گیت‌هاب بارگذاری کنید.');
}

/* ================= preview ================= */
function openPreview(){
  if(location.protocol==='file:'){toast('پیش‌نمایش فقط وقتی کار می‌کند که پنل از روی سایت منتشرشده یا یک سرور باز شده باشد.',true);return}
  const fr=h('iframe',{src:'../index.html?preview=1',title:'پیش‌نمایش'});
  const pv=h('div',{class:'pv'},h('div',{class:'pb'},h('b',{},'پیش‌نمایش'),h('span',{class:'hint'},'این همان سایت با تغییرات شماست، هنوز منتشر نشده.'),h('span',{class:'grow'}),
    h('button',{class:'btn sm',type:'button',onclick:()=>pv.classList.toggle('m')},'دسکتاپ / موبایل'),h('button',{class:'btn sm pri',type:'button',onclick:()=>{removeEventListener('message',onMsg);pv.remove();document.body.style.overflow=''}},'بستن')),h('div',{class:'fw'},fr));
  const onMsg=e=>{if(e.source!==fr.contentWindow||e.origin!==location.origin)return;if(e.data&&e.data.type==='rpm-ready')fr.contentWindow.postMessage({type:'rpm-content',content:JSON.parse(ser()),imgs:imgMap()},location.origin)};
  addEventListener('message',onMsg);document.body.append(pv);document.body.style.overflow='hidden';
}

/* ================= shell + boot ================= */
const TABS=[['home','متن‌های صفحه'],['works','آثار'],['cats','دسته‌بندی‌ها'],['resume','رزومه'],['contact','تماس و عکس‌ها'],['tr','ترجمهٔ خودکار'],['pub','انتشار']];
function renderShell(){
  const app=$('#app');app.replaceChildren(
    h('header',{class:'top'},h('h1',{},'پنل مدیریت',h('small',{},'ریحانه پیرزاده مقدم')),h('span',{id:'status',class:'hint'}),
      h('button',{class:'btn sm',type:'button',onclick:openPreview},'پیش‌نمایش'),h('button',{class:'btn sm pri',type:'button',onclick:()=>{st.tab='pub';rerender()}},'انتشار')),
    h('div',{class:'shell'},h('nav',{class:'side','aria-label':'بخش‌ها'},TABS.map(t=>h('button',{type:'button','data-tab':t[0],onclick:()=>{st.tab=t[0];rerender();window.scrollTo(0,0)}},t[1],t[0]==='works'&&h('b',{},faNum(st.c.works.length)),t[0]==='pub'&&h('b',{id:'pubdot'})))),
      h('main',{id:'main'})));
}
function rerender(){
  const y=window.scrollY;
  if(!$('#main'))renderShell();
  $$all('.side button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===st.tab?'true':'false'));
  const fn={home:tabHome,works:tabWorks,cats:tabCats,resume:tabResume,contact:tabContact,tr:tabTr,pub:tabPub}[st.tab];
  $('#main').replaceChildren(fn());
  const wb=$('.side button[data-tab="works"] b');if(wb)wb.textContent=faNum(st.c.works.length);
  touch();window.scrollTo(0,y);
}
const $$all=s=>[...document.querySelectorAll(s)];
function fixContent(c){
  c.tx=c.tx||{};c.cats=c.cats||[];c.works=c.works||[];c.resume=c.resume||[];c.contact=Object.assign({telegram:'',instagram:'',email:'',phone:'',phoneDisplay:''},c.contact);
  c.stats=c.stats||[];while(c.stats.length<4)c.stats.push({kind:'count',n:0,label:{en:'',fa:''}});
  c.portraits=c.portraits||{};
  ['studio','smile'].forEach(k=>{c.portraits[k]=c.portraits[k]||{img:'portrait-'+k,ext:'webp',w:1000,h:1333,lq:'',avg:'#777'}});
  ['pr.cube.t','pr.cube.d'].forEach(k=>{c.tx[k]=c.tx[k]||{en:'',fa:''}});
  c.cats.forEach(k=>{k.name=k.name||{en:'',fa:''};k.desc=k.desc||{en:'',fa:''}});
  c.works.forEach(w=>{w.title=w.title||{en:'',fa:''};w.mat=w.mat||{en:'',fa:''};w.place=w.place||{en:'',fa:''};w.dims=w.dims||'';w.year=+w.year||0});
  c.resume.forEach(col=>{col.title=col.title||{en:'',fa:''};col.items=col.items||[]});
  return c;
}
async function start(c,baseSha){
  st.c=fixContent(c);st.base=ser();st.baseSha=baseSha||await sha1git(JSON.stringify(c,null,1)+'\n')||null;
  const d=await DB.get();
  if(d&&d.c&&(JSON.stringify(d.c)!==st.base||Object.keys(d.pend||{}).length)){
    const k=await ask('پیش‌نویس ذخیره‌نشده','تغییراتی که قبلاً ایجاد کرده بودید و منتشر نشده پیدا شد'+(d.t?' ('+new Date(d.t).toLocaleString('fa-IR')+')':'')+'. بازیابی شود؟',[{key:0,label:'حذف پیش‌نویس',cls:'danger'},{key:1,label:'بازیابی',cls:'pri'}]);
    if(k){st.c=fixContent(d.c);for(const b in d.pend){const p=d.pend[b];st.pend[b]={ext:p.ext,files:p.files,urls:mkUrls(p.files)}}}else await DB.del();
  }
  rerender();
}
async function boot(){
  let c=null,sha=null;
  if(st.cfg.token&&st.cfg.owner&&st.cfg.repo){try{const f=await gh(`/repos/${st.cfg.owner}/${st.cfg.repo}/contents/content.json?ref=${encodeURIComponent(st.cfg.branch)}`);c=JSON.parse(unb64utf8(f.content));sha=f.sha}catch(e){}}
  if(!c&&location.protocol!=='file:'){try{const r=await fetch('../content.json',{cache:'no-store'});if(r.ok)c=await r.json()}catch(e){}}
  if(!c){try{const seedEl=$('#seed');if(seedEl)c=JSON.parse(seedEl.textContent)}catch(e){}}
  if(c)return start(c,sha);
  const f=h('input',{type:'file',accept:'.json,application/json',hidden:true,onchange:async e=>{try{await start(JSON.parse(await e.target.files[0].text()))}catch(x){toast('این فایل content.json معتبر نیست.',true)}}});
  $('#app').replaceChildren(h('div',{style:'max-width:34rem;margin:12vh auto;padding:0 1rem;text-align:center'},h('h2',{},'پنل مدیریت'),h('p',{class:'lead',style:'margin-inline:auto'},'فایل content.json پیدا نشد. این پنل باید داخل پوشهٔ admin سایت باشد، یا فایل content.json را از پوشهٔ سایت انتخاب کنید.'),f,h('button',{class:'btn pri',type:'button',onclick:()=>f.click()},'انتخاب فایل content.json')));
}
addEventListener('beforeunload',e=>{if(st.c&&dirty()&&!st.busy){e.preventDefault();e.returnValue=''}});
boot();
</script>
