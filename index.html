@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E0E0E; --paper-2:#181818; --ink:#EEEEEB; --mute:#9B9B96; --line:rgba(238,238,235,.14); --line-2:rgba(238,238,235,.34);
    --bronze:#D39A5D; --dk:#1D1915; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E0E0E; --paper-2:#181818; --ink:#EEEEEB; --mute:#9B9B96; --line:rgba(238,238,235,.14); --line-2:rgba(238,238,235,.34);
  --bronze:#D39A5D; --dk:#1D1915; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.7;font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:80;background:var(--paper)}
#app{overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
img{display:block;max-width:100%}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p,figure,dl,dd{margin:0}
:focus-visible{outline:2px solid var(--bronze);outline-offset:4px;border-radius:2px}
[tabindex="-1"]:focus{outline:0}
.wrap{width:100%;max-width:1720px;margin-inline:auto;padding-left:var(--gx);padding-right:var(--gxr)}
.dk,.hdr.dkm{--paper:var(--dk);--ink:var(--dk-ink);--mute:var(--dk-mute);--line:var(--dk-line);--line-2:var(--dk-line-2);--bronze:var(--dk-bronze)}
.dk{background:var(--paper);color:var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* type */
.lbl{display:flex;align-items:center;gap:.65rem;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1.4}
.dia{display:inline-block;width:.5rem;height:.5rem;background:var(--bronze);transform:rotate(45deg);flex:none}
.h2{font-weight:900;font-size:clamp(2.1rem,4.6vw,4.6rem);line-height:1;letter-spacing:-.012em}
.lead{font-size:clamp(1.12rem,1.5vw,1.4rem);line-height:1.5}
#app[lang="fa"]{line-height:1.95}
#app[lang="fa"] .lbl{letter-spacing:0;text-transform:none;font-size:.9rem}
#app[lang="fa"] .h2{font-size:clamp(2rem,4.2vw,4.2rem);line-height:1.3;letter-spacing:0}
#app[lang="fa"] .lead{line-height:1.8}

/* split-text reveals (word masks) */
[data-split] .w{display:inline-block;overflow:hidden;vertical-align:top;padding:.22em .12em;margin:-.22em -.12em}
[data-split] .wi{display:inline-block}
#app[lang="fa"] [data-split] .w{padding:.5em .14em;margin:-.5em -.14em}
.js [data-split] .wi{transform:translateY(118%) rotate(4deg);transform-origin:0 100%;transition:transform 1.15s var(--ease);transition-delay:calc(var(--i,0)*var(--st,80ms) + var(--d,0ms))}
.js [data-split].in .wi,.js.fs [data-split] .wi{transform:none}
.js [data-rv]{transform:translateY(34px);transition:transform 1.1s var(--ease);transition-delay:var(--d,0ms)}
.js [data-rv].in,.js.fs [data-rv]{transform:none}

/* intro + page-transition diamonds */
.intro{display:none}
.js .intro{display:grid;place-items:center;position:fixed;inset:0;z-index:100;background:var(--ink);overflow:hidden;animation:introOut .4s linear 1.3s forwards}
.intro i{position:absolute;left:50%;top:50%;width:calc(.7072*(100vw + 100vh) + 4px);aspect-ratio:1;translate:-50% -50%;rotate:45deg;background:var(--paper);scale:0;animation:introDia 1.15s var(--ease-io) .25s forwards}
.intro .mark{position:relative;width:20px;height:66px;background:var(--paper);animation:introMark .7s var(--ease) both}
@keyframes introDia{to{scale:1}}
@keyframes introMark{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
@keyframes introOut{to{opacity:0;visibility:hidden}}
.ptx{position:fixed;inset:0;z-index:95;pointer-events:none;visibility:hidden;overflow:hidden}
.ptx i{position:absolute;left:50%;top:50%;width:calc(.7072*(100vw + 100vh) + 4px);aspect-ratio:1;translate:-50% -50%;rotate:45deg;scale:0;background:var(--ink)}
.ptx.on{visibility:visible}.ptx.on i{scale:1;transition:scale .62s var(--ease-io)}
.ptx.out{visibility:visible}.ptx.out i{scale:0;rotate:135deg;transition:scale .72s var(--ease-io),rotate .72s var(--ease-io)}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:70;color:var(--ink);transition:transform .7s var(--ease)}
.hdr.hide{transform:translateY(-115%)}
.menu-open .hdr{transform:none}
.hdr::before{content:"";position:absolute;inset:0;z-index:-1;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transition:opacity .35s;border-bottom:1px solid var(--line)}
.hdr.stuck::before{opacity:1}
.menu-open .hdr::before{opacity:1;background:var(--paper)}
.hdr .wrap{display:flex;align-items:center;gap:1.4rem;height:var(--hdr)}
.brand{display:flex;align-items:center;gap:.75rem;font-weight:900;font-size:1rem;line-height:1;white-space:nowrap}
.mark{display:inline-block;width:12px;height:40px;flex:none;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.nav{display:flex;gap:clamp(1.2rem,2.6vw,2.6rem);margin-inline-start:auto;font-weight:700;font-size:.95rem}
.tools{display:flex;align-items:center;gap:.6rem}
.roll{position:relative;display:inline-block;overflow:hidden;height:1.5em;line-height:1.5}
.roll span{display:block;transition:transform .55s var(--ease)}
.roll span+span{position:absolute;inset:0;transform:translateY(130%)}
@media (hover:hover){.roll:hover span:first-child{transform:translateY(-130%)}.roll:hover span+span{transform:none}}
.lang{display:flex;align-items:center;height:42px;padding:3px;border:1px solid var(--line-2);border-radius:99px;font-weight:700;font-size:.82rem;line-height:1}
.lang .o{display:grid;place-items:center;min-width:2.5rem;height:100%;padding-inline:.5rem;border-radius:99px;transition:background .4s var(--ease),color .4s}
.lang .o.on{background:var(--ink);color:var(--paper)}
.tgl{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--line-2);border-radius:50%;transition:background .35s,color .35s}
.tgl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6}
@media (hover:hover){.tgl:hover{background:var(--ink);color:var(--paper)}}
.burger{display:none;position:relative;width:42px;height:42px;border:1px solid var(--line-2);border-radius:50%}
.burger i{position:absolute;inset-inline:13px;height:1.6px;background:currentColor;transition:transform .5s var(--ease),top .5s var(--ease)}
.burger i:nth-child(1){top:16px}.burger i:nth-child(2){top:24px}
.menu-open .burger i:nth-child(1){top:20px;transform:rotate(45deg)}
.menu-open .burger i:nth-child(2){top:20px;transform:rotate(-45deg)}
.menu{position:fixed;inset:0;z-index:65;background:var(--paper);color:var(--ink);padding:calc(var(--hdr) + env(safe-area-inset-top,0px) + 1.2rem) var(--gxr) calc(1.6rem + env(safe-area-inset-bottom,0px)) var(--gx);display:flex;flex-direction:column;justify-content:space-between;gap:2rem;overflow-y:auto;visibility:hidden;clip-path:circle(0px at var(--ox,50%) var(--oy,36px));transition:clip-path .95s var(--ease-io),visibility 0s .95s}
.menu-open .menu{visibility:visible;clip-path:circle(170vmax at var(--ox,50%) var(--oy,36px));transition:clip-path .95s var(--ease-io)}
.menu a.big{display:block;overflow:hidden;border-bottom:1px solid var(--line);font-weight:900;font-size:clamp(2.2rem,11vw,3.8rem);line-height:1.25;padding-block:.1em}
.menu a.big span{display:block;transform:translateY(105%);transition:transform .9s var(--ease)}
.menu-open .menu a.big span{transform:none;transition-delay:calc(.3s + var(--i)*70ms)}
.menu .mfoot{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-weight:700;color:var(--mute)}
@media (max-width:960px){.nav{display:none}.burger{display:block}.tools{margin-inline-start:auto}.hdr .wrap{gap:.8rem}}
@media (min-width:961px){.menu{display:none}}
@media (max-width:640px){.brand span:last-child{display:none}.mark{width:14px;height:46px}}

/* buttons */
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:.8rem;overflow:hidden;height:54px;padding-inline:1.6rem;border:1px solid var(--ink);border-radius:99px;font-weight:700;font-size:.98rem;line-height:1;white-space:nowrap;transition:color .45s var(--ease)}
.btn::before{content:"";position:absolute;inset:-1px;z-index:-1;background:var(--ink);border-radius:inherit;transition:transform .55s var(--ease)}
.btn.solid{color:var(--paper)}
.btn.solid::before{transform:translateY(0)}
.btn.ghost::before{transform:translateY(101%)}
.btn.ghost{color:var(--ink)}
@media (hover:hover){
  .btn.solid:hover{color:var(--ink)}.btn.solid:hover::before{transform:translateY(-101%)}
  .btn.ghost:hover{color:var(--paper)}.btn.ghost:hover::before{transform:translateY(0)}
}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
[dir="rtl"] .flip{transform:scaleX(-1)}

/* hairline grid (draws in) */
.gl{position:absolute;inset:0;pointer-events:none;z-index:0}
.gl .wrap{position:relative;height:100%}
.gl-in{position:absolute;top:0;bottom:0;left:var(--gx);right:var(--gxr)}
.gl i{position:absolute;display:block;background:var(--line)}
.gl .v{top:0;bottom:0;width:1px;margin-left:-.5px}
.gl>.h{left:0;right:0;top:var(--hdr);height:1px}
.js .gl .v{transform:scaleY(0);transform-origin:top;transition:transform 2s var(--ease-io);transition-delay:calc(var(--k,0)*160ms + 150ms)}
.js .gl>.h{transform:scaleX(0);transform-origin:left;transition:transform 2s var(--ease-io) .1s}
[dir="rtl"] .js .gl>.h{transform-origin:right}
.js .gl.in .v,.js.fs .gl .v{transform:scaleY(1)}
.js .gl.in>.h,.js.fs .gl>.h{transform:scaleX(1)}
@media (max-width:860px){.gl .v:nth-child(2),.gl .v:nth-child(4){display:none}}

/* hero */
.hero{position:relative;margin-top:calc(var(--hdr)*-1);display:flex;flex-direction:column;min-height:100svh;overflow-x:clip}
.hero-in{position:relative;z-index:1;flex:1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--cg);align-items:center;padding-top:calc(var(--hdr) + clamp(1.4rem,3.4vw,3rem));padding-bottom:clamp(2.2rem,4.4vw,4rem)}
.hero-txt{grid-column:1 / span 7;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:clamp(1.3rem,2.4vw,2.2rem);padding-block:clamp(.5rem,2vw,1.6rem)}
.name{font-weight:900;font-size:clamp(2.3rem,4.6vw,5rem);line-height:1;letter-spacing:-.015em;font-synthesis:none}
.name>span{display:block}
#app[lang="fa"] .name{font-size:clamp(2.5rem,5.4vw,5.6rem);line-height:1.32;letter-spacing:0}
.hero-lead{font-size:clamp(1.1rem,1.55vw,1.5rem);line-height:1.5;font-weight:700;max-width:34ch}
#app[lang="fa"] .hero-lead{line-height:1.85;max-width:36ch}
.cta-row{display:flex;gap:.8rem;flex-wrap:wrap}
.hero-meta{display:flex;flex-wrap:wrap;gap:.7rem 2.2rem;margin-top:clamp(.4rem,2vw,1.6rem);padding-top:1.3rem;border-top:1px solid var(--line)}
.avail i{width:8px;height:8px;border-radius:50%;background:var(--bronze);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.9);opacity:.35}}
.vis{grid-column:8 / span 5;position:relative;width:100%;aspect-ratio:5/6;translate:0 calc(var(--p,0)*34px)}
.sh{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;fill:none;stroke:var(--ink);stroke-width:1.3}
.sh .s{transform-box:fill-box;transform-origin:center}
.sh .d1{rotate:calc(45deg + var(--p,0)*90deg)}
.sh .d0{rotate:calc(45deg - var(--p,0)*180deg);stroke:var(--bronze)}
.sh .c1{scale:calc(1 + var(--p,0)*.1)}
.sh .l1{translate:calc(var(--p,0)*40px) 0}
.sh .l2{translate:0 calc(var(--p,0)*-60px)}
.js .sh .s{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.9s var(--ease-io);transition-delay:var(--d,0s)}
.js .vis.in .sh .s,.js.fs .sh .s{stroke-dashoffset:0}
.vis-img{position:absolute;left:17.5%;top:13.9%;width:65%;height:72.2%;z-index:1;translate:0 calc(var(--p,0)*-26px)}
.fig-in{position:relative;width:100%;height:100%;overflow:hidden;background:var(--lq) center/cover,var(--avg)}
.fig-in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.08);scale:1.1;transition:filter 1s var(--ease),scale 1.8s var(--ease)}
.js .fig-in{clip-path:polygon(50% 50%,50% 50%,50% 50%,50% 50%);transition:clip-path 1.5s var(--ease-io) .5s}
.js .vis.in .fig-in,.js.fs .fig-in{clip-path:polygon(50% -52%,152% 50%,50% 152%,-52% 50%)}
.js .fig-in img{scale:1.4}
.js .vis.in .fig-in img,.js.fs .fig-in img{scale:1.1}
@media (hover:hover){.vis:hover .fig-in img{filter:none}}
.vis-cap{position:absolute;left:0;bottom:-.2rem;z-index:2}
[dir="rtl"] .vis-cap{left:auto;right:0}
@media (max-width:860px){
  .hero-in{grid-template-columns:1fr;row-gap:2.6rem}
  .hero-txt{grid-column:1}
  .vis{grid-column:1;width:min(100%,24rem);margin-inline:auto}
  .name{font-size:clamp(2.5rem,12.5vw,4.4rem)}
  #app[lang="fa"] .name{font-size:clamp(2.4rem,11.5vw,4rem)}
}

/* shape wipes between sections */
.tr{--h:clamp(96px,14vw,210px);position:relative;height:var(--h);overflow:hidden;background:var(--paper);contain:paint}
.tr i,.tr b{position:absolute;left:50%;top:100%;display:block;width:calc(1.4143*(50vw + var(--h)) + 10px);aspect-ratio:1;translate:-50% -50%;rotate:45deg;scale:var(--s,0)}
.tr i{background:var(--dk)}
.tr b{border:1px solid var(--bronze);scale:calc(var(--s,0)*1.06)}
.tr.rev{background:var(--dk)}
.tr.rev i{top:0;background:var(--paper)}
.tr.rev b{top:0}

/* sections */
.sec{padding-block:clamp(4rem,8vw,8rem)}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,25rem);gap:2rem clamp(1rem,4vw,4rem);align-items:end;margin-bottom:clamp(2.2rem,4.4vw,4rem)}
.sec-head .lbl{margin-bottom:1.7rem}
.sub{color:var(--mute);font-size:1.06rem;line-height:1.55}
@media (max-width:860px){.sec-head{grid-template-columns:1fr}}
.filters{display:flex;flex-wrap:wrap;gap:.3rem 1.8rem;margin-bottom:clamp(2rem,4vw,3.4rem);padding-bottom:1rem;border-bottom:1px solid var(--line)}
.chip{position:relative;padding:.35rem 0;font-weight:700;font-size:.98rem;color:var(--mute);transition:color .35s}
.chip sup{font-size:.62em;margin-inline-start:.3em;color:var(--bronze);line-height:0}
.chip::after{content:"";position:absolute;inset:auto 0 -1px;height:2px;background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .55s var(--ease)}
[dir="rtl"] .chip::after{transform-origin:right}
.chip[aria-pressed="true"]{color:var(--ink)}.chip[aria-pressed="true"]::after{transform:scaleX(1)}
@media (hover:hover){.chip:hover{color:var(--ink)}}

/* works grid */
.works{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--cg);row-gap:clamp(3rem,6vw,6rem)}
.card{grid-column:1 / -1;min-width:0}
.card-btn{display:block;width:100%}
.frame{display:block;position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--lq) center/cover,var(--avg)}
.par{position:absolute;inset:0;scale:1.12;transition:scale 1.3s var(--ease)}
.par img{width:100%;height:100%;object-fit:cover}
.js .frame{clip-path:inset(0 0 100% 0);transition:clip-path 1.3s var(--ease-io)}
.js .in .frame,.js.fs .frame{clip-path:inset(0)}
.js .frame.fd{clip-path:polygon(50% 50%,50% 50%,50% 50%,50% 50%);transition:clip-path 1.6s var(--ease-io)}
.js .in .frame.fd,.js.fs .frame.fd{clip-path:polygon(50% -52%,152% 50%,50% 152%,-52% 50%)}
.js .frame .par{scale:1.38}
.js .in .frame .par,.js.fs .frame .par{scale:1.12}
@media (hover:hover){.js .in .card-btn:hover .par{scale:1.19}}
.ico{position:absolute;inset-block-start:1rem;inset-inline-end:1rem;display:grid;place-items:center;width:54px;height:54px;border-radius:50%;background:var(--paper);color:var(--ink);transform:scale(0) rotate(-90deg);transition:transform .6s var(--ease)}
.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.card-btn:hover .ico,.card-btn:focus-visible .ico{transform:none}}
.cap{display:flex;align-items:baseline;gap:1rem;margin-top:1rem}
.no{flex:none;min-width:2.6rem;font-size:.84rem;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.t{flex:1;min-width:0;font-weight:900;font-size:clamp(1.35rem,2vw,1.9rem);line-height:1.15}
.t span{background:linear-gradient(currentColor,currentColor) 0 100%/0 2px no-repeat;transition:background-size .6s var(--ease);padding-bottom:.08em}
[dir="rtl"] .t span{background-position:100% 100%}
@media (hover:hover){.card-btn:hover .t span{background-size:100% 2px}}
.y{flex:none;font-weight:700;font-size:.92rem;color:var(--mute);font-variant-numeric:tabular-nums}
.m{display:block;margin-top:.4rem;padding-inline-start:3.6rem;font-size:.96rem;color:var(--mute);line-height:1.45;min-height:1.45em}
@media (min-width:861px){
  .card.ca{grid-column:1 / span 6}.card.cb{grid-column:8 / span 5}.card.cc{grid-column:1 / span 5}.card.cd{grid-column:7 / span 6}.card.solo{grid-column:4 / span 6}
  .card.dn{margin-top:clamp(3rem,8vw,8rem)}
}

/* practice rows */
.rows{margin-inline:calc(var(--gx)*-1)}
.prow{position:relative;isolation:isolate;display:grid;grid-template-columns:clamp(2.6rem,4vw,4rem) minmax(0,5fr) minmax(0,5fr) minmax(5rem,auto) 3.2rem;gap:1rem clamp(1rem,2vw,2rem);align-items:center;padding:clamp(1.3rem,2.4vw,2.2rem) var(--gx);border-top:1px solid var(--line);transition:color .3s var(--ease) .12s}
.prow:last-child{border-bottom:1px solid var(--line)}
.prow::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ink);clip-path:polygon(50% 50%,50% 50%,50% 50%,50% 50%);transition:clip-path .8s var(--ease)}
.prow .pn{display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.9rem;color:var(--bronze);font-variant-numeric:tabular-nums;transition:color .3s .12s}
.prow .pt{font-weight:900;font-size:clamp(1.5rem,2.8vw,2.6rem);line-height:1.1}
.prow .pd{font-size:1rem;line-height:1.55;color:var(--mute);max-width:42ch;transition:color .3s .12s}
.prow .pc{font-weight:700;font-size:.92rem;white-space:nowrap;text-align:end}
.prow .pa{display:grid;place-items:center;width:3.2rem;height:3.2rem;border:1px solid var(--line-2);border-radius:50%;transition:transform .6s var(--ease),border-color .4s}
.prow .pa svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.prow:hover{color:var(--paper)}.prow:hover::before{clip-path:polygon(50% -52%,152% 50%,50% 152%,-52% 50%)}.prow:hover .pd{color:inherit;opacity:.8}.prow:hover .pn{color:var(--dk-bronze)}.prow:hover .pa{transform:rotate(45deg);border-color:currentColor}}
@media (max-width:860px){.prow{grid-template-columns:2.4rem minmax(0,1fr) 3rem}.prow .pn{grid-column:1;grid-row:1}.prow .pt{grid-column:2;grid-row:1}.prow .pd{grid-column:2 / -1;grid-row:2}.prow .pc{grid-column:2;grid-row:3;text-align:start}.prow .pa{grid-column:3;grid-row:1;width:3rem;height:3rem}}

/* scroll-driven outlines */
.deco{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco i{position:absolute;display:block;aspect-ratio:1;border:1px solid var(--line-2)}
.deco .c{border-radius:50%}
.deco .d{rotate:calc(45deg + var(--sp,0)*60deg)}
.deco .da{width:12vw;max-width:180px;inset-inline-start:5%;top:44%}
.deco .ca{width:11vw;max-width:170px;inset-inline-start:24%;top:45%;border-color:var(--bronze);translate:calc(var(--sp,0)*70px) 0}
.deco .db{width:5vw;max-width:76px;inset-inline-start:40%;top:54%;border-color:var(--bronze);rotate:calc(45deg - var(--sp,0)*90deg)}
.deco .cb{width:34vw;max-width:520px;inset-inline-start:-14%;top:4%;translate:0 calc(var(--sp,0)*-100px)}
.deco .dc{width:14vw;max-width:220px;inset-inline-start:30%;bottom:-2%;border-color:var(--bronze)}
.deco .cc{width:6vw;max-width:96px;inset-inline-start:41%;top:12%;border-color:var(--bronze);translate:calc(var(--sp,0)*40px) calc(var(--sp,0)*-50px)}
.deco .dd{width:120%;inset-inline-start:-18%;top:-10%;translate:0 calc(var(--sp,0)*-60px)}
.deco .ce{width:46%;inset-inline-end:-14%;bottom:-6%;border-color:var(--bronze);translate:calc(var(--sp,0)*-30px) calc(var(--sp,0)*40px)}

/* Inner Cube (dark room) */
.cube{position:relative;padding-top:clamp(3rem,6vw,5.5rem)}
.cube>.wrap,.about>.wrap,.contact>.wrap{position:relative;z-index:1}
.cube-intro{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--cg);row-gap:2.2rem;align-items:start;padding-bottom:clamp(2.6rem,5vw,5rem)}
.cube-intro>*:not(.deco){position:relative;z-index:1}
.cube-intro .l{grid-column:1 / span 6}
.cube-intro .lbl{margin-bottom:1.8rem}
.cube-intro .quote{grid-column:7 / span 6;padding-inline-start:clamp(.8rem,2vw,2rem);columns:2 15rem;column-gap:2.2rem;font-size:1.02rem;line-height:1.62;color:var(--ink);opacity:.92}
.cube-intro .quote p{break-inside:avoid-column;margin-bottom:1.1rem}
.cube-intro .sig{grid-column:1 / -1;display:flex;align-items:center;gap:.8rem;color:var(--mute);font-weight:700}
@media (max-width:860px){.cube-intro .l,.cube-intro .quote{grid-column:1 / -1}.cube-intro .quote{padding-inline-start:0}.cube-intro .deco{display:none}}
.hs{position:relative;z-index:1}
.hs-pin{position:relative;padding-block:1rem 3rem}
.hs-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-inline:var(--gx) var(--gxr)}
.hs-count{white-space:nowrap;font-weight:900;font-size:clamp(1.4rem,2.2vw,2.1rem);font-variant-numeric:tabular-nums;line-height:1}
.hs-count span{color:var(--mute);font-weight:700;font-size:.55em}
.hs-track{display:flex;gap:clamp(1.4rem,3vw,3.4rem);padding:1.6rem var(--gxr) 1.6rem var(--gx);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs-track::-webkit-scrollbar{display:none}
.hs-fig{flex:none;width:min(80vw,34rem);scroll-snap-align:center}
.hs-fig .no{min-width:0}
.hs-bar{display:none;height:1px;margin-inline:var(--gx) var(--gxr);background:var(--line)}
.hs-bar i{display:block;height:100%;background:var(--ink);transform:scaleX(0);transform-origin:left}
[dir="rtl"] .hs-bar i{transform-origin:right}
@media (min-width:901px) and (min-height:560px){
  .hs.pinned .hs-pin{position:sticky;top:env(safe-area-inset-top,0px);height:100svh;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:.6rem;padding-block:1.2rem 1.6rem}
  .hs.pinned .hs-track{width:max-content;align-self:flex-start;overflow:visible;scroll-snap-type:none;will-change:transform}
  .hs.pinned .hs-fig{width:min(58svh,44vw)}
  .hs.pinned .hs-bar{display:block}
}

/* about */
.about{position:relative;padding-block:clamp(3rem,6vw,5.5rem) clamp(4rem,8vw,7.5rem)}
.about-grid{position:relative;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--cg);align-items:start}
.about-grid>*:not(.deco){position:relative;z-index:1}
.about-fig{grid-column:1 / span 5;position:sticky!important;top:calc(var(--hdr) + 1.5rem)}
.about-fig .frame{aspect-ratio:4/5}
.about-fig .figcap{margin-top:.9rem;justify-content:flex-start}
.about-txt{grid-column:7 / span 6;display:flex;flex-direction:column;gap:clamp(1.8rem,3.4vw,3rem)}
.statement{font-weight:700;font-size:clamp(1.6rem,2.7vw,2.7rem);line-height:1.2;letter-spacing:-.005em}
#app[lang="fa"] .statement{line-height:1.65;letter-spacing:0}
.lw{opacity:.2;transition:opacity .5s var(--ease)}
.lw.on,.js.fs .lw{opacity:1}
html:not(.js) .lw{opacity:1}
.about-cols{columns:2 16rem;column-gap:2.4rem;font-size:1.02rem;line-height:1.62}
.about-cols p{break-inside:avoid-column;margin-bottom:1.1rem}
.pull{font-weight:700;font-size:clamp(1.3rem,1.9vw,1.8rem);line-height:1.3;padding-top:1.6rem;border-top:1px solid var(--line-2)}
#app[lang="fa"] .pull{line-height:1.65}
.stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.6rem clamp(1rem,2vw,2rem);margin-top:clamp(3.4rem,6vw,5.5rem);padding-top:2rem;border-top:1px solid var(--line-2)}
.stat b{display:block;font-weight:900;font-size:clamp(2rem,3.5vw,3.3rem);line-height:1.15;font-variant-numeric:tabular-nums}
@media (min-width:861px){.stat b{white-space:nowrap}}
.stat span{display:block;margin-top:.6rem;font-size:.92rem;line-height:1.4;color:var(--mute)}
@media (max-width:860px){.about-fig,.about-txt{grid-column:1 / -1}.about-fig{position:static!important;margin-bottom:2.4rem;max-width:28rem}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* resume */
.cv-grid{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));gap:3rem clamp(1.6rem,4vw,4.4rem)}
.cv-col h3{display:flex;align-items:flex-end;min-height:calc(2.5em + 1rem);font-weight:900;font-size:clamp(1.35rem,1.8vw,1.7rem);line-height:1.2;padding-bottom:1rem;border-bottom:1px solid var(--line-2)}
@media (max-width:960px){.cv-col h3{min-height:0}}
.cv-col li{position:relative;display:grid;grid-template-columns:4rem minmax(0,1fr);gap:1rem;padding-block:1rem;font-size:1rem;line-height:1.5}
.cv-col li.noyr{grid-template-columns:minmax(0,1fr)}
.cv-col li:not(.grp)::after{content:"";position:absolute;inset:auto 0 0;height:1px;background:var(--line)}
.js .cv-col li:not(.grp)::after{transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--ease);transition-delay:calc(var(--k,0)*90ms + 150ms)}
[dir="rtl"] .js .cv-col li:not(.grp)::after{transform-origin:right}
.js .cv-col.in li::after,.js.fs .cv-col li::after{transform:scaleX(1)}
.cv-col .yr{font-weight:900;color:var(--bronze);font-variant-numeric:tabular-nums}
.cv-col li.grp{display:block;padding-top:2rem;font-weight:900;color:var(--bronze)}
@media (max-width:960px){.cv-grid{grid-template-columns:1fr}}

/* contact */
.contact{position:relative;padding-top:clamp(3rem,6vw,5.5rem);overflow:clip}
.ct-title{margin-top:1.7rem;font-weight:900;font-size:clamp(2.6rem,6vw,6rem);line-height:1.02;letter-spacing:-.015em;max-width:16ch}
#app[lang="fa"] .ct-title{font-size:clamp(2.4rem,5vw,5rem);line-height:1.35;letter-spacing:0}
.ct-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--cg);row-gap:2.6rem;align-items:start;margin-top:clamp(2.4rem,5vw,4.4rem);padding-bottom:clamp(3.4rem,7vw,6rem)}

against a cube, caught between reason and feeling.","fa":"چهار پیکر برنزی در برخورد با یک مکعب، میان عقل و احساس."},"pr.n":{"en":"{n} works","fa":"{n} اثر"},"cube.lbl":{"en":"Series","fa":"مجموعه"},"cube.h":{"en":"The Inner Cube","fa":"مکعب درون"},"cube.p1":{"en":"This series reflects an inner struggle that every person meets, sooner or later, along the course of life: a tension between reason, which draws borders and angles, and feeling, which rebels against every limit.","fa":"این مجموعه بازتاب جدالی درونی است که هر انسان، دیر یا زود، در مسیر زیست خود با آن مواجه می‌شود؛ کشاکشی میان عقل که مرز و زاویه می‌سازد، و احساس که سر باز می‌زند از هر محدودیتی."},"cube.p2":{"en":"The figures in these works are half human, somewhere between life and death, between muscle and bone. They face a cube that is both alien and familiar; it carries the weight of reason and the tremor of doubt. A volume that seems fixed and rigid, yet changes on contact with the body and loses its own boundaries.","fa":"فیگورها در این آثار نیمه انسانی‌اند؛ در جایی میان زندگی و مرگ، میان ماهیچه و استخوان. آن‌ها با مکعبی مواجه‌اند که هم بیگانه است و هم آشنا؛ هم سنگینی خرد را در خود دارد و هم لرزش تردید. حجمی که به‌ظاهر ثابت و صُلب است اما در تماس با بدن دگرگون می‌شود و مرزهای خویش را از دست می‌دهد."},"cube.p3":{"en":"In this encounter, bodies collapse and are built again: moments of tension and resistance, of surrender and fatigue. Each figure bears witness to how hard it is to balance reason and feeling, a balance with no final destination, formed only through trial and error and lived experience.","fa":"در این برخورد، تن‌ها فرو می‌ریزند و دوباره ساخته می‌شوند؛ لحظه‌هایی از کشش و مقاومت، از تسلیم و خستگی. هر فیگور گواهی است بر دشواری برقراری توازن میان عقل و احساس؛ توازنی که مقصدی قطعی ندارد و تنها در مسیر آزمون و خطا و تجربه‌ی زیسته شکل می‌گیرد."},"cube.p4":{"en":"These sculptures tell of an endless search: the search of a human being who, between the rigidity of reason and the fluidity of feeling, is always changing.","fa":"این مجسمه‌ها روایتگر جست‌وجویی بی‌پایان‌اند؛ جست‌وجوی انسانی که میان صُلبیت عقل و سیالی احساس، مدام در حال دگرگونی است."},"cube.sig":{"en":"Bronze on a stone base · Four works","fa":"برنز روی پایه سنگ · چهار اثر"},"cube.hint":{"en":"Scroll or swipe through the series","fa":"برای دیدن مجموعه اسکرول یا سوایپ کنید"},"about.lbl":{"en":"About","fa":"درباره من"},"about.s":{"en":"I'm Reyhaneh Pirzadeh Moghadam, an artist and sculptor. I hold a bachelor's degree in sculpture and a master's in painting, and alongside my practice I work as an art teacher.","fa":"من، ریحانه پیرزاده مقدم، هنرمند و مجسمه‌ساز، فارغ‌التحصیل کارشناسی مجسمه‌سازی و کارشناسی ارشد نقاشی هستم و در کنار فعالیت‌های هنری، به عنوان مدرس هنر نیز مشغول به کارم."},"about.p2":{"en":"My path in art began with graphic design, grew richer through painting, and found its focus in sculpture, where I could translate my view of space, material and form into a three-dimensional language.","fa":"مسیر من در هنر از گرافیک آغاز شد، با نقاشی غنی‌تر شد و در مجسمه‌سازی به نقطه تمرکز رسید؛ جایی که توانستم نگاه خود به فضا، ماده و فرم را به زبان سه‌بعدی ترجمه کنم."},"about.p3":{"en":"Working with a wide range of materials, from iron and stone to bronze and fiberglass, has let me find a new way to express my ideas each time. For me a sculpture is never only an independent volume: sometimes it is the voice of a space, sometimes the reflection of a memory, and sometimes a wordless conversation with the viewer.","fa":"تجربه کار با متریال‌های متنوع، از آهن و سنگ تا برنز و فایبرگلاس، به من این امکان را داده که هر بار شیوه‌ای تازه برای بیان ایده‌هایم بیابم. برای من، مجسمه فقط یک حجم مستقل نیست؛ گاهی صدای فضاست، گاهی بازتابی از خاطره، و گاهی گفت‌وگویی بی‌کلام با مخاطب."},"about.p4":{"en":"In my work I try to build a bridge between aesthetics and lived experience: to make pieces that, besides their visual value, offer a chance for connection, discovery and a shared experience between the work and its viewer.","fa":"در آثارم تلاش می‌کنم میان زیبایی‌شناسی و تجربه زیسته پلی بزنم؛ آثاری بیافرینم که علاوه بر ارزش بصری، فرصتی برای ارتباط، مکاشفه و تجربه مشترک میان اثر و بیننده فراهم کنند."},"about.pull":{"en":"Sometimes the voice of a space, sometimes the reflection of a memory, and sometimes a wordless conversation with the viewer.","fa":"گاهی صدای فضا، گاهی بازتاب خاطره، و گاهی گفت‌وگویی بی‌کلام با مخاطب."},"about.fig":{"en":"Reyhaneh Pirzadeh Moghadam","fa":"ریحانه پیرزاده مقدم"},"cv.lbl":{"en":"Background","fa":"سوابق"},"cv.h":{"en":"Resume","fa":"رزومه"},"ct.lbl":{"en":"Contact","fa":"تماس"},"ct.h":{"en":"Let's talk","fa":"بیایید گفت‌وگو کنیم"},"ct.lead":{"en":"For commissions, collaborations or invitations to events, write to me through any of these.","fa":"برای سفارش اثر، همکاری یا دعوت به رویداد، از یکی از این راه‌ها پیام بدهید."},"ct.cta":{"en":"Message on Telegram","fa":"پیام در تلگرام"},"ct.tg":{"en":"Telegram","fa":"تلگرام"},"ct.ig":{"en":"Instagram","fa":"اینستاگرام"},"ct.em":{"en":"Email","fa":"ایمیل"},"ct.ph":{"en":"Phone","fa":"تلفن"},"ct.copied":{"en":"Copied","fa":"کپی شد"},"ct.sel":{"en":"Text selected, copy it","fa":"متن انتخاب شد، کپی کنید"},"ft.c":{"en":"© 2026 Reyhaneh Pirzadeh Moghadam. All rights to the works reserved.","fa":"© ۱۴۰۵ ریحانه پیرزاده مقدم. همه حقوق آثار محفوظ است."},"ft.top":{"en":"Back to top ↑","fa":"بازگشت به بالا ↑"},"lb.year":{"en":"Year","fa":"سال"},"lb.mat":{"en":"Material","fa":"متریال"},"lb.dim":{"en":"Dimensions","fa":"ابعاد"},"lb.place":{"en":"Place","fa":"مکان"},"lb.cm":{"en":"cm","fa":"سانتی‌متر"},"a.close":{"en":"Close","fa":"بستن"},"a.prev":{"en":"Previous work","fa":"اثر قبلی"},"a.next":{"en":"Next work","fa":"اثر بعدی"},"a.lb":{"en":"Enlarged view of the work","fa":"نمایش بزرگ اثر"},"a.menu":{"en":"Menu","fa":"منو"},"a.nav":{"en":"Main navigation","fa":"ناوبری اصلی"},"a.theme":{"en":"Switch between light and dark theme","fa":"تغییر تم روشن و تاریک"},"a.lang":{"en":"Language","fa":"زبان"},"a.filters":{"en":"Filter works","fa" /* ---------- works rendering ---------- */
var hero=$('.hero'),vis=$('#vis'),heroH=1;
function yearOf(w){return w.sh?(rtl?num(w.sh):String(w.sh+621)):''}
function dimsOf(w){return w.dims?'<bdi>'+num(w.dims)+'</bdi> '+T('lb.cm'):''}
function metaOf(w){
  var parts=[w.mat[lang]];
  if(w.cat==='cube')parts.push(num(w.dims)+' '+T('lb.cm'));else parts.push(w.place[lang]);
  return parts.filter(Boolean).join(' · ');
}
function renderWorks(){
  $$('.card-btn[data-n]').forEach(function(b){
    var i=+b.getAttribute('data-n'),w=W[i];
    var t=$('[data-wt]',b),y=$('[data-wy]',b),m=$('[data-wm]',b),no=$('.no',b),im=$('img',b);
    t.textContent=w.t[lang];if(y)y.textContent=yearOf(w);m.textContent=metaOf(w);
    var idx=w.cat==='cube'?i-W.filter(function(x){return x.cat!=='cube'}).length:i;
    no.textContent='('+num(pad(idx+1))+')';
    b.setAttribute('aria-label',T('a.view').replace('{t}',w.t[lang]));
    im.alt=(w.cat==='portrait'?'':T('a.sculpt'))+w.t[lang]+(w.mat[lang]?(rtl?'، ':', ')+w.mat[lang]:'');
  });
}
function counts(){
  var n={all:0};
  W.forEach(function(w){if(w.cat!=='cube'){n.all++;n[w.cat]=(n[w.cat]||0)+1}});
  var ns=W.length-n.all;
  $$('.chip').forEach(function(c){c.querySelector('sup').textContent=num(n[c.getAttribute('data-f')]||0)});
  $$('[data-count-of]').forEach(function(e){var k=e.getAttribute('data-count-of'),v=k==='cube'?ns:(n[k]||0);e.textContent=(v===1&&D.en['pr.n1']?T('pr.n1'):T('pr.n')).replace('{n}',num(v))});
  $$('[data-no]').forEach(function(e){e.textContent=num(pad(+e.getAttribute('data-no')))});
  $$('[data-count]').forEach(function(e){e.textContent=num(e.hasAttribute('data-done')?e.getAttribute('data-count'):(e.getAttribute('data-count0')||e.getAttribute('data-count')))});
  var ht=$('#hsT');if(ht)ht.textContent='/ '+num(pad(ns));
}

/* ---------- language ---------- */
function applyLang(l){
  lang=l;rtl=l==='fa';app.lang=l;app.setAttribute('dir',rtl?'rtl':'ltr');
  var S=D[l];
  $$('[data-i]').forEach(function(el){
    var v=S[el.getAttribute('data-i')];if(v==null)return;
    if(el.classList.contains('roll'))el.innerHTML='<span>'+esc(v)+'</span><span aria-hidden="true">'+esc(v)+'</span>';
    else el.textContent=v;
  });
  $$('[data-ia]').forEach(function(el){var p=el.getAttribute('data-ia').split(':'),v=S[p[1]];if(v!=null)el.setAttribute(p[0],v)});
  $$('.lang .o').forEach(function(o){o.classList.toggle('on',o.getAttribute('data-l')===l)});
  document.title=S.title;var md=$('meta[name="description"]');if(md)md.setAttribute('content',S.desc);
  $$('[data-sh]').forEach(function(e){var y=+e.getAttribute('data-sh');e.textContent=rtl?num(y):String(y+621)});
  renderWorks();counts();
  $$('[data-split]').forEach(splitEl);
  litWords=$$('.lw');litOn=-1;
  if(ready){hsMeasure();measureHero()}
}
var saved=null;try{saved=localStorage.getItem('rpm-lang')}catch(e){}
function switchLang(){
  var nl=lang==='en'?'fa':'en';
  app.classList.add('swap');
  setTimeout(function(){
    applyLang(nl);try{localStorage.setItem('rpm-lang',nl)}catch(e){}

}
$('#lang').addEventListener('click',switchLang);

/* ---------- theme ---------- */
try{var th=localStorage.getItem('rpm-theme');if(th==='dark'||th==='light')root.setAttribute('data-theme',th)}catch(e){}
$('#theme').addEventListener('click',function(){
  var cur=root.getAttribute('data-theme');
  if(!cur)cur=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  var nx=cur==='dark'?'light':'dark';root.setAttribute('data-theme',nx);

});

/* ---------- menu ---------- */
var burger=$('#burger'),menuEl=$('#menu'),hdr=$('#hdr');
function menu(open){
  if(open===app.classList.contains('menu-open'))return;
  if(open){var r=burger.getBoundingClientRect();menuEl.style.setProperty('--ox',(r.left+r.width/2)+'px');menuEl.style.setProperty('--oy',(r.top+r.height/2)+'px');hdr.classList.remove('hide')}
  app.classList.toggle('menu-open',open);burger.setAttribute('aria-expanded',open);menuEl.setAttribute('aria-hidden',!open);lock(open);
}
burger.addEventListener('click',function(){menu(!app.classList.contains('menu-open'))});
$$('a',menuEl).forEach(function(a){a.addEventListener('click',function(){menu(false)})});

/* ---------- reveals ---------- */
var ro=null,HERO_SEL='.hero [data-split],.hero [data-rv],.hero .vis,.hero .gl';
function reveal(el){
  el.classList.add('in');
  if(el.hasAttribute('data-count')||$('[data-count]',el)){$$('[data-count]',el).concat(el.hasAttribute('data-count')?[el]:[]).forEach(countUp)}
}
function countUp(e){
  if(e.hasAttribute('data-done'))return;e.setAttribute('data-done','1');
  var to=+e.getAttribute('data-count');if(reduce){e.textContent=num(to);return}
  var t0=performance.now(),d=1500;
  (function step(t){var p=clamp((t-t0)/d,0,1),v=Math.round(to*(1-Math.pow(1-p,4)));e.textContent=num(v);if(p<1)requestAnimationFrame(step)})(t0);
}
function setupReveals(){
  var els=$$('[data-rv],[data-split],.card,.cv-col').filter(function(e){return !hero.contains(e)&&!e.closest('.hs')});
  var gls=$$('.gl').filter(function(e){return !hero.contains(e)});
  if(!('IntersectionObserver' in window)){root.classList.add('fs');return}
  ro=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){ro.unobserve(e.target);reveal(e.target)}})},{rootMargin:'0px 0px -8% 0px',threshold:.12});
  els.forEach(function(e){ro.observe(e)});
  var go=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){go.unobserve(e.target);e.target.classList.add('in')}})},{threshold:0,rootMargin:'0px 0px -10% 0px'});
  gls.forEach(function(e){go.observe(e)});
}
function heroIn(){$$(HERO_SEL).forEach(function(e){e.classList.add('in')})}
function replayHero(){
  var hs=$$(HERO_SEL);
  hs.forEach(function(e){e.classList.remove('in')});
  void hero.offsetWidth;
  setTimeout(heroIn,40);
}

/* ---------- works layout + filters ---------- */
var grid=$('#grid'),filt='all';
function layout(){
  var vis=$$('.card',grid).filter(function(c){return !c.hidden}),n=vis.length;
  vis.forEach(function(c,k){
    c.classList.remove('ca','cb','cc','cd','solo','dn');
    if(n%2===1&&k===n-1){c.classList.add('solo');return}
    var pair=Math.floor(k/2),pos=k%2,even=pair%2===0;
    c.classList.add(pos===0?(even?'ca':'cc'):(even?'cb':'cd'));
    if(pos===1)c.classList.add('dn');
  });
  return vis;
}
function setFilter(f){
  filt=f;
  $$('.chip').forEach(function(c){c.setAttribute('aria-pressed',c.getAttribute('data-f')===f?'true':'false')});
  $$('.card',grid).forEach(function(c){var show=f==='all'||c.getAttribute('data-cat')===f;c.hidden=!show;if(show&&ro){c.classList.remove('in');ro.observe(c)}});
  layout();measureAll();onScroll();
}
$$('.chip').forEach(function(c){c.addEventListener('click',function(){setFilter(c.getAttribute('data-f'))})});
$$('.prow[data-f]').forEach(function(a){a.addEventListener('click',function(){setFilter(a.getAttribute('data-f'))})});

/* ---------- visibility tracking (parallax frames, outlines) ---------- */
var parFrames=[],parVis=[],parIO=null,sps=$$('[data-sp]'),spVis=[],spIO=null;
function measureAll(){
  parFrames=$$('.card .frame, .about-fig .frame, .ct-fig .frame').filter(function(f){return f.querySelector('.par')});
  if(!parIO&&'IntersectionObserver' in window){
    parIO=new IntersectionObserver(function(es){es.forEach(function(e){var i=parVis.indexOf(e.target);if(e.isIntersecting){if(i<0)parVis.push(e.target)}else if(i>=0)parVis.splice(i,1)});onScroll()},{rootMargin:'12% 0px'});
    spIO=new IntersectionObserver(function(es){es.forEach(function(e){var i=spVis.indexOf(e.target);if(e.isIntersecting){if(i<0)spVis.push(e.target)}else if(i>=0)spVis.splice(i,1)});onScroll()},{rootMargin:'10% 0px'});
    sps.forEach(function(s){spIO.observe(s)});
  }
  if(parIO){parIO.disconnect();parVis=[];parFrames.forEach(function(f){parIO.observe(f)})}
}

/* ---------- pinned horizontal gallery ---------- */
var hsEl=$('#hs'),hsTr=$('#hsTrack'),hsBar=$('#hsBar'),hsN=$('#hsN'),hs={on:false,travel:0,cp:0,tp:0};
function hsMeasure(){
  if(!hsEl)return;
  var pin=!reduce&&matchMedia('(min-width:901px) and (min-height:560px)').matches;
  hs.on=pin;hsEl.classList.toggle('pinned',pin);
  if(pin){
    hsTr.style.transform='';hsEl.style.height='';
    hs.travel=Math.max(0,hsTr.scrollWidth-root.clientWidth);
    hsEl.style.height=(hs.travel+innerHeight)+'px';
  }else{hsEl.style.height='';hsTr.style.transform='';hs.travel=0}
}
function hsUpdate(){
  if(!hs.on||!hsEl)return false;
  var r=hsEl.getBoundingClientRect(),span=r.height-innerHeight;
  hs.tp=span>0?clamp(-r.top/span,0,1):0;
  hs.cp+=(hs.tp-hs.cp)*.14;if(Math.abs(hs.tp-hs.cp)<.0004)hs.cp=hs.tp;
  hsTr.style.transform='translate3d('+((rtl?1:-1)*hs.cp*hs.travel).toFixed(1)+'px,0,0)';
  hsBar.style.transform='scaleX('+hs.cp.toFixed(4)+')';
  var NS=Math.max(1,hsTr.children.length),n=clamp(Math.round(hs.cp*(NS-1))+1,1,NS);if(hsN.getAttribute('data-n')!=n){hsN.setAttribute('data-n',n);hsN.textContent=num(pad(n))}
  return hs.cp!==hs.tp;
}

/* ---------- scroll loop ---------- */
var cy=window.scrollY,lastY=cy,rafT=0,heroVis=true,litEl=$('.statement'),litWords=[],litOn=-1,litVis=false;
var trs=$$('.tr'),dks=$$('.dk'),heroP=-1;
function measureHero(){heroH=Math.max(1,hero.offsetHeight)}
function onScroll(){if(!rafT)rafT=requestAnimationFrame(tick)}
function tick(){
  rafT=0;
  var y=window.scrollY,dy=y-lastY;lastY=y;
  var vh=innerHeight;
  /* reads */
  var trR=trs.map(function(t){return t.getBoundingClientRect()});
  var dkR=dks.map(function(t){return t.getBoundingClientRect()});
  var parR=parVis.map(function(f){return f.getBoundingClientRect()});
  var spR=spVis.map(function(f){return f.getBoundingClientRect()});
  var litR=litVis&&litWords.length?litEl.getBoundingClientRect():null;
  /* header */
  hdr.classList.toggle('stuck',y>24);
  if(!app.classList.contains('menu-open')){
    if(dy>6&&y>240)hdr.classList.add('hide');else if(dy<-6||y<240)hdr.classList.remove('hide');
  }
  var onDk=false;for(var q=0;q<dkR.length;q++){if(dkR[q].top<=36&&dkR[q].bottom>=36){onDk=true;break}}
  hdr.classList.toggle('dkm',onDk);
  cy+=(y-cy)*(reduce?1:.12);if(Math.abs(y-cy)<.25)cy=y;
  var busy=cy!==y;
  /* hero shapes */
  if(heroVis&&!reduce){
    var p=clamp(cy/heroH,0,1);
    if(Math.abs(p-heroP)>.0003){heroP=p;vis.style.setProperty('--p',p.toFixed(4))}
  }
  /* shape wipes */
  trs.forEach(function(t,i){
    var r=trR[i],v;
    if(reduce)v=1;else v=ease(clamp((vh*.95-r.top)/(vh*.7),0,1));
    if(t._v!==v){t._v=v;t.style.setProperty('--s',v.toFixed(4))}
  });
  /* parallax + outlines */
  if(!reduce){
    parVis.forEach(function(f,i){
      var r=parR[i],prog=clamp((vh-r.top)/(vh+r.height),0,1);
      f.firstElementChild.style.translate='0 '+((prog-.5)*-r.height*.1).toFixed(1)+'px';
    });
    spVis.forEach(function(e,i){
      var r=spR[i],sp=clamp((vh-r.top)/(vh+r.height),0,1);
      e.style.setProperty('--sp',sp.toFixed(4));
    });
  }
  if(litR){
    var pr=clamp((vh*.86-litR.top)/(litR.height+vh*.42),0,1),on=Math.round(pr*litWords.length);
    if(on!==litOn){for(var k=0;k<litWords.length;k++)litWords[k].classList.toggle('on',k<on);litOn=on}
  }
  if(hsUpdate())busy=true;
  if(busy)rafT=requestAnimationFrame(tick);
}
addEventListener('scroll',onScroll,{passive:true});
var rz=0;
addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){measureHero();hsMeasure();onScroll()},160)});
if('IntersectionObserver' in window){
  new IntersectionObserver(function(es){heroVis=es[0].isIntersecting;if(heroVis)onScroll()}).observe(hero);
  new IntersectionObserver(function(es){litVis=es[0].isIntersecting;if(litVis)onScroll()},{rootMargin:'20% 0px'}).observe(litEl);
  new IntersectionObserver(function(es){if(es[0].isIntersecting){$$('.hs-fig').forEach(function(f){f.classList.add('in');var im=$('img',f);if(im)im.loading='eager'});}},{rootMargin:'120% 0px'}).observe(hsEl||hero);
}else{litVis=true;$$('.hs-fig').forEach(function(f){f.classList.add('in')})}

/* ---------- shape page transition for in-page links ---------- */
var ptEl=$('#pt'),ptBusy=false;
function jump(h){
  var id=h.slice(1),t=id&&id!=='top'?document.getElementById(id):null;
  var top=t?t.getBoundingClientRect().top+window.scrollY:0;
  window.scrollTo({top:top,left:0,behavior:'instant'});
  try{history.replaceState(null,'',h)}catch(e){}
  if(t){t.setAttribute('tabindex','-1');t.focus({preventScroll:true})}
  onScroll();
}
function navTo(h){
  if(ptBusy)return;
  if(reduce||lb.classList.contains('on')){jump(h);return}
  ptBusy=true;ptEl.classList.add('on');
  setTimeout(function(){
    jump(h);
    ptEl.classList.remove('on');ptEl.classList.add('out');
    setTimeout(function(){ptEl.classList.remove('out');ptBusy=false},740);
  },640);
}
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href^="#"]');
  if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey||e.button)return;
  var h=a.getAttribute('href');if(!h||h==='#'||h.indexOf('#work-')===0)return;
  e.preventDefault();navTo(h);
});

/* ---------- lightbox (opens from the card's own image) ---------- */
var lb=$('#lb'),lbImg=$('#lbImg'),cur=-1,opener=null,tk=0;
function dl(k,v){return v?'<dt>'+k+'</dt><dd>'+v+'</dd>':''}
function frameOf(i){return $('.card-btn[data-n="'+i+'"] .frame')}
function flipFrom(el){
  if(reduce||!el)return;
  var f=el.getBoundingClientRect(),l=lbImg.getBoundingClientRect();
  if(!f.width||!l.width||f.bottom<0||f.top>innerHeight)return;
  lbImg.style.transition='none';lbImg.style.transformOrigin='0 0';
  lbImg.style.transform='translate('+(f.left-l.left)+'px,'+(f.top-l.top)+'px) scale('+(f.width/l.width)+','+(f.height/l.height)+')';
  lbImg.getBoundingClientRect();
  lbImg.style.transition='transform .85s var(--ease-io),opacity .4s';lbImg.style.transform='none';
}
function show(i,from){
  cur=(i+W.length)%W.length;var w=W[cur],my=++tk;
  $('#lbCnt').innerHTML='<span class="dia"></span>'+num(pad(cur+1))+' / '+num(W.length);
  $('#lbCat').textContent=T('cat.'+w.cat);
  $('#lbTitle').textContent=w.t[lang];
  $('#lbMeta').innerHTML=dl(T('lb.year'),yearOf(w))+dl(T('lb.mat'),w.mat[lang])+dl(T('lb.dim'),dimsOf(w))+dl(T('lb.place'),w.place[lang]);
  lb.style.setProperty('--lq','url('+w.lq+')');lb.style.setProperty('--avg',w.avg);
  lbImg.style.setProperty('--lq','url('+w.lq+')');lbImg.style.setProperty('--avg',w.avg);
  lbImg.alt=w.t[lang]+(w.mat[lang]?(rtl?'، ':', ')+w.mat[lang]:'');
  if(from){lbImg.src=imgUrl(w.img,960,w.ext);lbImg.classList.remove('sw');flipFrom(from)}
  else{lbImg.style.transition='opacity .4s';lbImg.style.transform='none';lbImg.classList.add('sw')}
  var low=new Image();low.src=imgUrl(w.img,960,w.ext);
  var up=function(src){if(my!==tk)return;if(!from)lbImg.src=src;lbImg.classList.remove('sw')};
  low.onload=function(){up(low.src);
    var hi=new Image();hi.src=imgUrl(w.img,1600,w.ext);
    hi.onload=function(){if(my===tk)lbImg.src=hi.src};
    [1,-1].forEach(function(d){var n=W[(cur+d+W.length)%W.length];(new Image()).src=imgUrl(n.img,960,n.ext)});
  };
  low.onerror=function(){up(imgUrl(w.img,560,w.ext))};
  try{history.replaceState(null,'','#work-'+w.slug)}catch(e){}
}
function openLb(i,from){
  opener=document.activeElement;
  lb.classList.add('on');lb.setAttribute('aria-hidden','false');lock(true);
  show(i,from);$('#lbX').focus({preventScroll:true});
}
function closeLb(){
  if(!lb.classList.contains('on'))return;
  var to=frameOf(cur);
  if(!reduce&&to){
    var f=to.getBoundingClientRect(),l=lbImg.getBoundingClientRect();
    if(f.width&&f.bottom>0&&f.top<innerHeight){
      lbImg.style.transformOrigin='0 0';lbImg.style.transition='transform .7s var(--ease-io)';
      lbImg.style.transform='translate('+(f.left-l.left)+'px,'+(f.top-l.top)+'px) scale('+(f.width/l.width)+','+(f.height/l.height)+')';
    }
  }
  lb.classList.remove('on');lb.setAttribute('aria-hidden','true');lock(false);
  try{history.replaceState(null,'','#works')}catch(e){}
  if(opener&&opener.focus)opener.focus({preventScroll:true});
}
$$('.card-btn[data-n]').forEach(function(b){b.addEventListener('click',function(){openLb(+b.getAttribute('data-n'),$('.frame',b))})});
$('#lbX').addEventListener('click',closeLb);
$('#lbPrev').addEventListener('click',function(){show(cur-1)});
$('#lbNext').addEventListener('click',function(){show(cur+1)});
lb.addEventListener('click',function(e){if(e.target===lb||e.target.classList.contains('lb-stage'))closeLb()});
addEventListener('keydown',function(e){
  if(e.key==='Escape'){menu(false);closeLb();return}
  if(!lb.classList.contains('on'))return;
  if(e.key==='ArrowRight')show(cur+(rtl?-1:1));
  else if(e.key==='ArrowLeft')show(cur+(rtl?1:-1));
  else if(e.key==='Tab'){
    var f=$$('button',lb),first=f[0],last=f[f.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
  }
});
var sx=0;
lb.addEventListener('touchstart',function(e){sx=e.changedTouches[0].clientX},{passive:true});
lb.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>56){var fwd=rtl?dx>0:dx<0;show(cur+(fwd?1:-1))}},{passive:true});
function fromHash(){
  var h=location.hash.replace('#','');
  if(h.indexOf('work-')===0){var s=h.slice(5);for(var i=0;i<W.length;i++){if(W[i].slug===s){if(!lb.classList.contains('on'))openLb(i);else if(cur!==i)show(i);return}}}
}
addEventListener('hashchange',fromHash);

/* ---------- copy ---------- */
var toast=$('#toast'),tt=0;
function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('on')},1900)}
$$('[data-copy]').forEach(function(b){
  b.addEventListener('click',function(){
    var v=b.getAttribute('data-copy');
    var done=function(){b.classList.add('ok');say(T('ct.copied'));setTimeout(function(){b.classList.remove('ok')},1400)};
    var fb=function(){var r=document.createRange();r.selectNodeContents(b.parentNode.querySelector('.v'));var s=getSelection();s.removeAllRanges();s.addRange(r);say(T('ct.sel'))};
    try{navigator.clipboard.writeText(v).then(done,fb)}catch(e){fb()}
  });
});

/* ---------- boot ---------- */
var failsafe=setTimeout(function(){root.classList.add('fs')},6500);
setupReveals();
applyLang(saved==='fa'?'fa':'en');
measureAll();layout();measureHero();
function start(){
  if(ready)return;ready=true;
  measureHero();hsMeasure();measureAll();
  app.classList.add('ready');
  var wait=reduce?0:Math.max(0,1300-performance.now());
  setTimeout(heroIn,wait);
  clearTimeout(failsafe);
  onScroll();fromHash();
}
var fp=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load('900 100px Doran','Reyhaneh ریحانه'),document.fonts.load('700 20px Doran','Aa آب'),document.fonts.load('400 20px Doran','Aa آب')]):Promise.resolve();
Promise.race([fp,new Promise(function(r){setTimeout(r,1600)})]).then(start,start);
}
boot();
})();
